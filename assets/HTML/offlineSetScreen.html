<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ミニ麻雀｜信州大学競技麻雀部咲</title>
 
     <!-- CSS読み込み -->
    <link rel="stylesheet" href="hand.css">

    <!--JavaScript読み込み-->
    <script src="../JavaScripts/offlineScreen.js" defer></script>
</head>

<body>
    
    <!--オフライン設定画面-->
    <section id = "offlineSettingScreen">

        <div class = "menuButton">
            <button class = "rule">遊び方</button>
            <button class = "setting">設定</button>
        </div>

        <div id = offlineSettting>
            <h1>オフライン</h1>
            <p>信州大学競技麻雀部咲</p>

            <div id = "offlineButton">
                <p>手牌数</p>
                    <button class = "handNum" value = "4">4枚</button>
                    <button class = "handNum" value = "7">7枚</button>
                    <button class = "handNum" value = "10">10枚</button>

                <p>牌種</p>
                    <button class = "handKinds" value = "1">萬子</button>
                    <button class = "handKinds" value = "2">筒子</button>
                    <button class = "handKinds" value = "3">索子</button>
                    <button class = "handKinds" value = "4">字牌</button>

                <button class = "offlineStartBtn">ゲーム開始</button>
                <button class = "offlineBackBtn">戻る</button>
            </div>
        </div>
    </section>
